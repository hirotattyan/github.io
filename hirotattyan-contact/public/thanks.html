<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="5;url=../../index.html">
    <title>お問い合わせ送信完了 | ひろたっちゃん</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .thanks-main { padding: 56px 20px; }
        .thanks-card { max-width: 640px; margin: 0 auto; padding: 40px 28px; border: 1px solid #e5e7eb; border-radius: 16px; background: #fff; text-align: center; }
        .thanks-icon { display: inline-grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: #eaf5ee; color: #247348; font-size: 34px; }
        .thanks-card h1 { font-size: clamp(22px, 4.5vw, 28px); line-height: 1.5; margin: 24px 0 16px; }
        .thanks-card p { margin: 12px 0; }
        .thanks-note { color: #555; font-size: 14px; }
        .thanks-button { display: inline-block; max-width: 100%; margin-top: 20px; padding: 14px 24px; border-radius: 8px; background: #2563eb; color: #fff; font-weight: bold; text-decoration: none; }
        .thanks-button:hover { background: #1d4ed8; }
        .thanks-button:focus-visible { outline: 3px solid #2563eb; outline-offset: 4px; }
        @media (max-width: 600px) { .thanks-main { padding: 32px 16px; } .thanks-card { padding: 32px 20px; } }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="../../index.html" class="site-logo" aria-label="ひろたっちゃんのポートフォリオへ戻る">
                <img src="image/logo.png" alt="" width="200" height="110">
                <span class="site-logo-name">ひろたっちゃん</span>
            </a>
        </div>
    </header>
    <main class="thanks-main">
        <section class="thanks-card" aria-labelledby="thanks-title">
            <span class="thanks-icon" aria-hidden="true">✓</span>
            <h1 id="thanks-title">お問い合わせを送信しました</h1>
            <p>お問い合わせありがとうございます。<br>内容を確認し、メールにて折り返しご連絡いたします。</p>
            <p class="thanks-note">5秒後にポートフォリオへ戻ります。<br>自動で切り替わらない場合は、下のボタンを押してください。</p>
            <a class="thanks-button" href="../../index.html">ポートフォリオに戻る</a>
        </section>
    </main>
</body>
</html>
