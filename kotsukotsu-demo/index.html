<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f0e4"><meta name="description" content="一か月ずつ、わたしたちの街を育てる。建設・経営シミュレーション『こつこつ商店街』。"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="こつこつ商店街"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="app.webmanifest" crossorigin="use-credentials"><link rel="apple-touch-icon" href="assets/app-icon-180.png"><link rel="icon" type="image/png" sizes="192x192" href="assets/app-icon-192.png"><title>こつこつ商店街｜体験版</title><link rel="stylesheet" href="style.css?v=import-ui-tidy-1"></head>
<body><div class="demo-banner">こつこつ商店街 · 体験版 <span>マスコット誕生まで遊べます</span></div>
<header class="masthead"><a class="wordmark title-logo" href="#" id="brand" aria-label="こつこつ商店街"><img src="assets/title-logo.webp" width="768" height="512" alt="こつこつ商店街" fetchpriority="high" decoding="async" draggable="false"></a><div class="header-actions"><button id="saveMenu" class="icon-button" aria-label="保存・再開メニュー">保存・再開</button></div></header>
<main>
<section class="topline"><div><p class="eyebrow">商店街 再生日誌</p><h1 id="date">1年目 1月</h1><span id="season" class="season"></span></div><div class="cash"><span>運営資金</span><strong id="cash">800万円</strong><small id="debt"></small></div></section>
<section class="indicators" aria-label="経営状況"><div><span>当月の営業見込</span><strong id="profit"></strong></div><div><span>月間来街人数〈見込〉</span><strong id="visitors"></strong></div><div><span>営業中の店舗</span><strong id="openShops"></strong></div></section>
<div class="workspace"><section class="town-section"><div class="town-heading"><div><span class="eyebrow">OUR LITTLE TOWN</span><h2>今日も、この街で。</h2></div><div><button class="text-button" id="townZoom" aria-pressed="false">街を拡大</button>　<button class="text-button" id="townGuide">操作ガイド</button></div></div><div id="townStatus" class="town-status" role="status" aria-live="polite" aria-atomic="true"></div><div class="town-wrap"><div id="weatherBadge" class="weather-badge" role="img" aria-label="今月の天候：晴れ" aria-live="polite"></div><canvas id="town" width="1100" height="760" aria-label="斜め上から見た商店街。建物をタップすると詳細を表示します。"></canvas><div class="map-legend"><span class="dot open"></span>営業 <span class="dot build"></span>工事 <span class="dot closed"></span>休業・未接続</div></div><div id="placementHint" class="placement-hint" aria-live="polite" hidden></div><div class="town-caption"><span id="townMood"></span><button class="text-button" id="photoMode" data-global="photo" hidden>記念撮影</button><button class="text-button" id="postgameReview" data-global="postgameReview" hidden>クリア時の評価</button><button class="text-button" id="entranceMenu">入口を整える</button><button class="text-button" id="expand">隣接区画を解放</button></div><div class="notice-list" id="notices" aria-live="polite"></div></section>
<aside class="insight"><div class="side-title"><span class="eyebrow">PEOPLE & POSSIBILITIES</span><h2>この街に来る人たち</h2></div><div id="segments"></div><div class="request" id="request"></div><div class="forecast" id="forecast"></div></aside></div>
<nav class="tabs" aria-label="経営メニュー"><button data-tab="build" class="active">建てる・整える</button><button data-tab="events">企画・予定表</button><button data-tab="finance">収支をみる</button><button data-tab="goals">目標・図鑑</button></nav>
<section id="tools" class="tools" aria-live="polite"></section>
<section class="season-music" aria-label="BGMの設定"><div><button id="musicToggle" aria-pressed="false">BGM：オフ</button><span id="musicTrack">季節・イベントに合わせて自動切替</span></div><label for="musicVolume">音量 <input id="musicVolume" type="range" min="0" max="100" value="30"><output id="musicVolumeValue" for="musicVolume">30%</output></label></section><footer class="game-footer"><div class="maker-credit"><small>制作</small><div class="maker-logo"><a href="../index.html" style="display:block"><img src="assets/hirotatchan-logo.webp" width="1254" height="1254" alt="ひろたっちゃんのポートフォリオへ" loading="lazy" decoding="async" draggable="false"></a></div></div><span id="saveStatus">月初に自動保存します</span></footer>
</main>
<div class="month-dock" id="monthDock"><div><strong id="dockMonth"></strong><small>眺めている間、経営時間は進みません。</small></div><button id="next" class="primary">今月を決算して、翌月へ <span>→</span></button></div>
<dialog id="dialog"><button id="dialogClose" class="dialog-close" aria-label="閉じる">×</button><div id="dialogBody"></div><div id="importControls" class="import-controls" hidden><input id="importFile" type="file" accept=".json,application/json" aria-label="保存ファイルを選ぶ"><p id="importStatus" class="save-note" role="status"></p><div id="importDropZone" class="import-drop-zone"><strong>保存ファイルをここへドロップ</strong><p>フォルダーからJSONファイルをこの枠にドラッグしてください。</p></div><div class="actions"><button data-do="back">保存画面に戻る</button></div></div></dialog>
<div id="toast" role="status" hidden></div>
<script src="demo-config.js"></script><script src="config.js?v=project-rebalance-1"></script><script src="engine.js?v=compact-history-1"></script><script src="tenants.js?v=tenant-rotation-1"></script><script src="legacy.js?v=titles-rebalance-1"></script><script src="progression.js?v=future-town-1"></script><script src="events.js?v=capacity-items-1"></script><script src="story.js?v=titles-rebalance-1"></script><script src="music.js?v=bad-ending-music-1"></script><script src="mascot.js?v=castle-motion-2"></script><script src="town-traffic.js?v=castle-guidance-preview-1"></script><script src="town-art.js?v=circus-signs-1"></script><script src="town.js?v=hidden-souvenir-2"></script><script src="storage.js?v=compact-history-1"></script><script src="weather.js?v=sunny-climate-1"></script><script src="profiles.js?v=five-town-slots-1"></script><script src="app.js?v=import-ui-tidy-1"></script>
</body></html>
